# Production on alexu-cloud, checked out at /srv/apps/101ru.com.
# The shared Traefik stack (/srv/infra/traefik) terminates HTTPS with Let's
# Encrypt and routes 101ru.com (www redirects to it) to this container over the
# traefik-proxy network. No host ports are published.
# The database is the shared MySQL 8.4 stack (/srv/infra/mysql), reached as
# `mysql` over the internal mysql-shared network.
# Nothing is queued or scheduled, so there's no worker or scheduler container.
#
# .env (also read by Compose for DATA_PATH). Readable by www-data:
#   sudo chown root:33 .env && sudo chmod 640 .env
#   APP_URL=https://101ru.com  APP_ENV=production  APP_DEBUG=false
#   DATA_PATH=/srv/data/101ru.com
#   DB_CONNECTION=mysql  DB_HOST=mysql  DB_PORT=3306
#   DB_DATABASE=101ru  DB_USERNAME=101ru  DB_PASSWORD=<its password>
#
#   sudo docker compose config -q && sudo docker compose up -d --build
#
# Persistent files under DATA_PATH (./data if unset). Back up storage/app/
# together with a dump of the database, so a restored database never points
# at missing photos:
#   storage/app/public/post/    post photos (main/<id>.jpg, images/<id>/*)
#   storage/app/public/slider/  home page slider
#   storage/logs/               Laravel logs (no need to back up)
# Missing folders are created on start and handed to www-data (UID 33).
# Local development uses compose.dev.yaml (COMPOSE_FILE in the local .env).

name: 101ru

services:
  app:
    image: 101ru-app:latest
    build:
      context: .
      target: prod
    restart: unless-stopped
    # Data lives outside the checkout (DATA_PATH), so the code folder can be
    # deleted and re-cloned. storage/framework (cache, compiled views, sessions)
    # isn't mounted: it's rebuilt in the container on every start.
    volumes:
      - ./.env:/var/www/html/.env:ro
      - ${DATA_PATH:-./data}/storage/app:/var/www/html/storage/app
      - ${DATA_PATH:-./data}/storage/logs:/var/www/html/storage/logs
    # traefik-proxy: web traffic in (and outbound internet);
    # mysql-shared is internal (no internet), for the database only
    networks:
      - traefik-proxy
      - mysql-shared
    labels:
      traefik.enable: "true"
      # One router (and one Let's Encrypt certificate) for both names;
      # the middleware sends www to the bare domain, keeping the path
      traefik.http.routers.101ru.rule: "Host(`101ru.com`) || Host(`www.101ru.com`)"
      traefik.http.routers.101ru.entrypoints: "websecure"
      traefik.http.routers.101ru.middlewares: "101ru-www"
      traefik.http.middlewares.101ru-www.redirectregex.regex: "^https://www\\.101ru\\.com/(.*)"
      traefik.http.middlewares.101ru-www.redirectregex.replacement: "https://101ru.com/$${1}"
      traefik.http.middlewares.101ru-www.redirectregex.permanent: "true"
      traefik.http.services.101ru.loadbalancer.server.port: "80"
    healthcheck:
      test: ["CMD", "curl", "-fsS", "-o", "/dev/null", "http://localhost/up"]
      interval: 30s
      timeout: 5s
      retries: 3
      # Traefik only routes to a container once it's healthy, so check quickly
      # after a (re)start instead of waiting a full interval
      start_period: 30s
      start_interval: 2s

# Created by the Traefik and MySQL stacks, which must be running first
networks:
  traefik-proxy:
    external: true
  mysql-shared:
    external: true
