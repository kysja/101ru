# Local development: docker compose up -d (COMPOSE_FILE=compose.dev.yaml in the local .env)
# Served by the shared Traefik proxy on alexu-dev (/srv/infra/traefik):
# https://101ru.dev.alexu.dev -> app, https://vite-101ru.dev.alexu.dev -> node
# Database: the shared MySQL container (DB_HOST=mysql) over mysql-shared
# Data: DATA_PATH=/srv/data/101ru in the local .env (storage/app, storage/logs)

name: 101ru-dev

services:
  app:
    image: 101ru-app:dev
    build:
      context: .
      target: dev
    # Photos and logs live outside the checkout under DATA_PATH, as in
    # production (unset: they stay in ./storage)
    volumes:
      - .:/var/www/html
      - ${DATA_PATH:-.}/storage/app:/var/www/html/storage/app
      - ${DATA_PATH:-.}/storage/logs:/var/www/html/storage/logs
    networks:
      - default
      - traefik-proxy
      - mysql-shared
    labels:
      - traefik.enable=true
      - traefik.docker.network=traefik-proxy
      - traefik.http.routers.101ru.rule=Host(`101ru.dev.alexu.dev`)
      - traefik.http.routers.101ru.entrypoints=websecure
      - traefik.http.services.101ru.loadbalancer.server.port=80

  node:
    image: node:24-alpine
    working_dir: /var/www/html
    user: node
    # npm ci (never rewrites the lockfile) only on first run or when the lockfile changed
    command: ["sh", "-c", "if [ ! -f node_modules/.package-lock.json ] || [ package-lock.json -nt node_modules/.package-lock.json ]; then npm ci; fi; npm run dev"]
    environment:
      VITE_DEV_HOST: vite-101ru.dev.alexu.dev
    volumes:
      - .:/var/www/html
    networks:
      - default
      - traefik-proxy
    labels:
      - traefik.enable=true
      - traefik.docker.network=traefik-proxy
      - traefik.http.routers.101ru-vite.rule=Host(`vite-101ru.dev.alexu.dev`)
      - traefik.http.routers.101ru-vite.entrypoints=websecure
      - traefik.http.services.101ru-vite.loadbalancer.server.port=5180

# Shared networks created during server setup; never recreate or remove them
networks:
  traefik-proxy:
    external: true
  mysql-shared:
    external: true
